# GPU overlay for docker-compose.
#
# Grants backend (query path) and worker (ingestion path) access to all
# NVIDIA GPUs on the host. Requires NVIDIA Container Toolkit.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile dev up -d --build
#
# CPU-only machines: just use the base file.
#
# 4GB GPU note: both pods load ONNX/SPLADE → ~400MB baseline. Concurrent
# SPLADE batches push toward 3GB peak. Cap WORKER_MAX_JOBS=1 in .env if
# you see VRAM pressure or OOM kills.

x-gpu-resources: &gpu-resources
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  backend:
    <<: *gpu-resources

  worker:
    <<: *gpu-resources
