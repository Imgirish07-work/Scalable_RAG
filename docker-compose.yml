# Scalable RAG — local dev stack (Phase 1).
#
# Services:
#   postgres  — Documents metadata (also visible in pgAdmin on localhost:5432)
#   redis     — Cache
#   minio     — S3-compatible object store for document blobs (console on :9001)
#   backend   — FastAPI app
#
# Qdrant runs in the cloud (set QDRANT_URL + QDRANT_API_KEY in .env).
# No local qdrant container — saves RAM for ONNX/CUDA workloads.
#
# Both docker and bare-metal modes use the same Postgres container.
#   docker mode  → backend container talks to compose service `postgres:5432`
#   native mode  → uvicorn on host talks to `localhost:5432` (compose exposes it)
#   pgAdmin      → connect to localhost:5432 to inspect data
#
# Usage:
#   1. Copy .env.example to .env and set POSTGRES_* + LLM keys + bootstrap token.
#   2. docker compose --profile dev up --build

# Shared env + code mounts so backend (API pod) and worker (Arq pod) stay in sync.
x-backend-env: &backend-env
  QDRANT_URL: "${QDRANT_URL:?Set QDRANT_URL in .env to your Qdrant Cloud URL}"
  QDRANT_API_KEY: "${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}"
  QDRANT_PREFER_GRPC: "${QDRANT_PREFER_GRPC:-true}"
  REDIS_URL: "redis://redis:6379/0"
  WORKER_REDIS_URL: "redis://redis:6379/0"
  BACKEND_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}"
  S3_ENDPOINT: "http://minio:9000"
  S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:-http://localhost:9000}"
  S3_BUCKET: "${S3_BUCKET:-scalable-rag-documents}"
  S3_REGION: "${S3_REGION:-us-east-1}"
  S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
  DEBUG: "false"

x-backend-volumes: &backend-volumes
  - ./backend:/app/backend:ro
  - ./pipeline:/app/pipeline:ro
  - ./rag:/app/rag:ro
  - ./agents:/app/agents:ro
  - ./cache:/app/cache:ro
  - ./chunking:/app/chunking:ro
  - ./config:/app/config:ro
  - ./llm:/app/llm:ro
  - ./utils:/app/utils:ro
  - ./vectorstore:/app/vectorstore:ro
  - ./optimizer:/app/optimizer:ro
  - ./models:/app/models:ro
  - backend_data:/app/data

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["dev", "full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["dev", "full"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  minio:
    # S3-compatible object store for document blobs. Console on :9001 for dev.
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["dev", "full"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: "${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:5173,http://localhost}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    profiles: ["dev", "full"]
    ports:
      - "8000:8000"
    env_file: .env
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    # Arq ingest worker — consumes jobs enqueued by the API pod, runs the full
    # ingestion pipeline, publishes progress to Redis pub/sub.
    build:
      context: .
      dockerfile: Dockerfile.backend
    profiles: ["dev", "full"]
    env_file: .env
    environment: *backend-env
    volumes: *backend-volumes
    command: ["arq", "backend.workers.arq_settings.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    # Production-style nginx bundle. Day-to-day dev runs `npm run dev` on the
    # host instead — this profile is only for smoke-testing the prod image
    # locally before deploy.
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    profiles: ["prod", "full"]
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  backend_data:
  minio_data:
